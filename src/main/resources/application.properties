# ===== LOCAL DEVELOPMENT SETTINGS ======
# Local PostgreSQL (installed on Windows) - Active configuration for daily development
spring.datasource.url=jdbc:postgresql://localhost:5432/BookDB
spring.datasource.username=postgres
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HIBERNATE JPA CONFIG ======
# Auto-create/update tables based on @Entity annotations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== SQL DATA INITIALIZATION ======
# Runs the existing SQL files on startup (order matters!)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:roles.sql,classpath:Users.sql,classpath:books.sql,classpath:user_roles.sql
spring.sql.init.continue-on-error=true

# ===== SERVER CONFIG ======
server.port=8080
spring.application.name=VirtualBookstore

# ===== DOCKER/DOCKER-COMPOSE SETTINGS (for container deployment) ======
# Uncomment these when running with docker-compose up to use containerized PostgreSQL:
# spring.datasource.url=jdbc:postgresql://postgres:5432/BookStore
# spring.datasource.username=ilias
# spring.datasource.password=1234
# NOTE: In production/container mode, we'll use create-drop or none for schema management with Flyway/migration scripts
